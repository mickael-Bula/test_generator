# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.default_vat_rate: 20.0

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $projectDir: '%kernel.project_dir%'
            float $defaultVatRate: '%app.default_vat_rate%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    _instanceof:
        # On ajoute un tag à tous les clients qui implémentent l'interface LlmClientInterface
        App\Llm\LlmClientInterface:
            tags: [ 'app.llm_client' ]

        # On ajoute un tag à tous les clients qui implémentent l'interface TestPromptBuilderInterface
        App\PromptBuilder\TestPromptBuilderInterface:
            tags: [ 'app.test_prompt_builder']


    App\Service\AiPlatformFactory:
        arguments:
            $geminiKey: '%env(string:default::GEMINI_API_KEY)%'
            $openAiKey: '%env(string:default::OPENAI_API_KEY)%'
            $anthropicKey: '%env(string:default::ANTHROPIC_API_KEY)%'
            $openRouterKey: '%env(string:default::OPENROUTER_API_KEY)%'
            $ollamaUrl: '%env(string:default::OLLAMA_HOST)%'

    # On configure la Factory avec les variables déclarées dans le .env
    App\Llm\LlmClientFactory:
        arguments:
            $defaultProvider: '%env(default::LLM_PROVIDER)%'
            $defaultModel: '%env(default::LLM_MODEL)%'

    # -------------------------------------------------------------------------
    # Plateformes Symfony AI individuelles étiquetées pour le ServiceLocator
    # -------------------------------------------------------------------------

    # Platform Gemini
    ai.platform.gemini:
        class: Symfony\AI\Platform\Platform
        factory: ['@App\Service\AiPlatformFactory', 'createGeminiPlatform']
        tags:
            - { name: 'ai.platform', index: 'gemini' }

    # Platform OpenAI
    ai.platform.openai:
        class: Symfony\AI\Platform\Platform
        factory: ['@App\Service\AiPlatformFactory', 'createOpenAiPlatform']
        tags:
            - { name: 'ai.platform', index: 'openai' }

    # Platform Anthropic
    ai.platform.anthropic:
        class: Symfony\AI\Platform\Platform
        factory: ['@App\Service\AiPlatformFactory', 'createAnthropicPlatform']
        tags:
            - { name: 'ai.platform', index: 'anthropic' }

    # Platform OpenRouter
    ai.platform.openrouter:
        class: Symfony\AI\Platform\Platform
        factory: [ '@App\Service\AiPlatformFactory', 'createOpenRouterPlatform' ]
        tags:
            - { name: 'ai.platform', index: 'openrouter' }

    # Platform Ollama
    ai.platform.ollama:
        class: Symfony\AI\Platform\Platform
        factory: ['@App\Service\AiPlatformFactory', 'createOllamaPlatform']
        tags:
            - { name: 'ai.platform', index: 'ollama' }

    # Configuration spécifique pour le client Ollama
#    App\Llm\OllamaClient:
#        public: true

    # Configuration spécifique pour le service Ollama
#    App\Service\OllamaService:
#        public: true
#        arguments:
#            $ollamaHost: '%env(default::OLLAMA_HOST)%'

    # Configuration pour l'adaptateur Symfony AI
    App\Llm\SymfonyAiClient:
        arguments:
            $defaultProvider: '%env(default::LLM_PROVIDER)%'
            $defaultModel: '%env(default::LLM_MODEL)%'
